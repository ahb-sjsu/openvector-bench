[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openvector-bench"
version = "0.0.1"
description = "A nested, content-addressed benchmark family for vector search at 10^6-10^12 rows, with geometric, structural, and human truth layers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andrew H. Bond", email = "andrew.bond@sjsu.edu" }]
keywords = [
    "vector-search",
    "approximate-nearest-neighbor",
    "benchmark",
    "information-retrieval",
    "reproducibility",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
gpu = ["torch>=2.0"]
sources = ["huggingface-hub>=0.23", "pyarrow>=14"]
# black is pinned EXACTLY, not with ~=. Its output changed on a patch
# release twice: ebdb3c4 loosened the pin to ~=26.5 to fix drift, and on
# 2026-08-07 a 26.5.x bump reformatted geometry.py and left CI red for four
# days. A formatter that can change output on a patch bump must not float.
# Bump this line deliberately, and reformat in the same commit.
dev = ["pytest>=7", "ruff~=0.15.0", "black==26.5.1"]

[project.urls]
Homepage = "https://github.com/ahb-sjsu/openvector-bench"
Repository = "https://github.com/ahb-sjsu/openvector-bench"

[tool.setuptools.packages.find]
where = ["."]
include = ["openvector_bench*"]

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
